  <!-- belgi asosi -->
  <rect x="10" y="10" width="220" height="220" rx="62" fill="url(#g)"/>
  <rect x="18" y="18" width="204" height="204" rx="55" fill="url(#d)"/>
  <circle cx="120" cy="120" r="70" fill="#8b5cf6" opacity="0.35" filter="url(#glow)"/>

  <!-- orbita -->
  <ellipse cx="120" cy="120" rx="78" ry="30" fill="none" stroke="url(#g)" stroke-width="5" transform="rotate(-28 120 120)"/>

  <!-- qurilma (telefon) -->
  <rect x="92" y="62" width="56" height="116" rx="16" fill="url(#g)"/>
  <rect x="98" y="68" width="44" height="104" rx="11" fill="#0b0a22"/>
  <!-- signal yoylari -->
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
    <path d="M108 118 Q120 106 132 118"/>
    <path d="M100 108 Q120 88 140 108" stroke-opacity="0.7"/>
  </g>
  <circle cx="120" cy="132" r="6" fill="#fff"/>

  <!-- orbitadagi nuqta -->
  <circle cx="186" cy="92" r="9" fill="#fff"/>
  <circle cx="186" cy="92" r="16" fill="#fff" opacity="0.25"/>
